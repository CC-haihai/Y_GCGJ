<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Y_归层工具 · 多图层演示</title>
<style>
  :root{
    --bg:#262626; --surface:#2e2e2e; --surface2:#343434;
    --line:#3a3a3a; --line2:#3f3f3f; --line3:#565656;
    --text:#dcdcdc; --text2:#c8c8c8; --dim:#8c8c8c; --dim2:#6a6a6a;
    --accent:#3b82c4; --accent-hi:#4a92d4;
    --ok:#6fbf73; --warn:#e0a050; --info:#6ea8e0;
    --c1:#6ea8e0; --c2:#e0a050; --c3:#6fbf73;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; padding:24px 20px 40px;
    background:#191919; color:var(--text);
    font-family:"Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
    font-size:12px; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; align-items:center; gap:16px;
  }

  .card{
    width:100%; max-width:1000px;
    background:var(--bg); border:1px solid #3a3a3a; border-radius:10px;
    box-shadow:0 20px 56px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.03);
    overflow:hidden;
  }

  /* ---------- 顶栏 ---------- */
  .top{
    height:46px; display:flex; align-items:center; gap:14px; padding:0 16px;
    background:#1f1f1f; border-bottom:1px solid #333;
  }
  .top .ttl{font-size:13px; font-weight:600; letter-spacing:.3px;}
  .top .ttl small{font-weight:400; color:var(--dim2); margin-left:8px; font-size:11px;}
  .top .sp{flex:1;}
  .tabs{display:flex; gap:4px; background:#161616; padding:3px; border-radius:7px;}
  .tabs button{
    border:none; background:transparent; color:var(--dim); cursor:pointer;
    font-family:inherit; font-size:11.5px; padding:5px 11px; border-radius:5px;
    transition:background .16s,color .16s;
  }
  .tabs button:hover{color:var(--text2);}
  .tabs button.on{background:var(--accent); color:#fff;}
  .replay{
    border:1px solid var(--line3); background:#2a2a2a; color:var(--text2);
    font-family:inherit; font-size:11.5px; padding:5px 12px; border-radius:5px;
    cursor:pointer; transition:background .16s;
  }
  .replay:hover{background:#343434;}

  /* ---------- 主体 ---------- */
  .main{display:flex; height:486px;}
  .left{
    width:372px; flex:0 0 372px; border-right:1px solid var(--line);
    background:#232323; padding:14px; overflow:hidden;
  }
  .right{flex:1; position:relative; background:#1c1c1c; min-width:0; overflow:hidden;}
  #canvas{position:absolute; inset:0; width:100%; height:100%; display:block;}

  /* 圆盘（右键长按） */
  #pie{
    opacity:0; transform-box:fill-box; transform-origin:center;
    filter:drop-shadow(0 8px 22px rgba(0,0,0,.6));
  }
  #pie.in{animation:pieIn .2s cubic-bezier(.2,.9,.3,1.15) both;}
  #pie.out{animation:pieOut .15s ease-in both;}
  @keyframes pieIn{ from{opacity:0; transform:scale(.82);} to{opacity:1; transform:scale(1);} }
  @keyframes pieOut{ from{opacity:1; transform:scale(1);} to{opacity:0; transform:scale(.9);} }
  @keyframes sectorIn{ from{opacity:0;} to{opacity:1;} }

  .pie-ctrl{
    position:absolute; right:10px; top:8px; z-index:6;
    display:none; align-items:center; gap:2px;
    background:rgba(28,28,28,.92); border:1px solid #3d3d3d;
    border-radius:6px; padding:3px 5px;
  }
  .pie-ctrl.on{display:flex;}
  .pie-ctrl .lbl{font-size:9.5px; color:#7a7a7a; margin-right:4px;}
  .pie-ctrl button{
    background:none; border:1px solid transparent; color:#a8a8a8;
    font-size:10px; padding:2px 6px; border-radius:4px;
    cursor:pointer; font-family:inherit; line-height:1.5;
  }
  .pie-ctrl button:hover{background:#333; color:#fff;}
  .pie-ctrl button.on{background:var(--accent); color:#fff;}

  /* 窄屏（预览面板常见）改成上下排，别把画布挤没 */
  @media (max-width:820px){
    .main{flex-direction:column; height:auto;}
    .left{width:auto; flex:0 0 auto; border-right:none; border-bottom:1px solid var(--line);}
    .right{flex:0 0 auto; height:340px;}
  }

  /* ---------- 面板 ---------- */
  .panel{
    background:var(--bg); border:1px solid #3a3a3a; border-radius:7px;
    overflow:hidden;
  }
  .p-head{
    height:40px; display:flex; align-items:center; padding:0 12px;
    background:#2b2b2b; border-bottom:1px solid var(--line);
    position:relative;
  }
  .p-head::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--ok);
  }
  .p-head .name{font-size:12.5px; font-weight:600;}
  .p-head .dot{
    width:7px;height:7px;border-radius:50%;background:var(--ok);
    box-shadow:0 0 8px rgba(111,191,115,.6); margin-right:7px;
  }
  .p-head .sp{flex:1;}
  .p-head .sw{width:34px;height:18px;border-radius:9px;background:var(--accent);position:relative;}
  .p-head .sw::after{
    content:"";position:absolute;width:13px;height:13px;border-radius:50%;
    background:#e8e8e8;top:2.5px;left:18px;
  }

  .p-row{
    display:flex; align-items:flex-start; gap:8px;
    padding:9px 12px; border-bottom:1px solid #303030;
  }
  .p-row:last-child{border-bottom:none;}
  .p-row .cat{width:40px; flex:0 0 40px; color:var(--dim); padding-top:5px;}
  .chips{display:flex; flex-wrap:wrap; gap:4px; flex:1; min-width:0;}
  .chips.static{
    align-items:center; height:24px; color:var(--text2); font-size:10.5px;
    gap:5px; flex-wrap:nowrap;
  }
  .chips.static .arw{color:#5c5c5c; font-size:10px;}

  .chip{
    display:flex; align-items:center; gap:4px;
    height:24px; padding:0 6px 0 4px;
    background:#1f1f1f; border:1px solid var(--line2); border-radius:4px;
    font-size:10.5px; color:var(--text2); cursor:pointer; user-select:none;
    transition:border-color .18s, background .18s, color .18s, transform .18s;
    position:relative; white-space:nowrap;
  }
  .chip:hover{border-color:var(--line3);}
  .chip .sw2{width:9px;height:9px;border-radius:2px;flex:0 0 9px;}
  .chip.on{
    border-color:var(--accent-hi); background:#22303c; color:#fff;
    box-shadow:0 0 0 1px rgba(74,146,212,.35);
  }
  .chip.on::before{
    content:""; position:absolute; left:-1px; top:-1px; bottom:-1px; width:2px;
    background:var(--accent-hi); border-radius:4px 0 0 4px;
  }
  .chip .ord{
    position:absolute; top:-5px; right:-4px; min-width:13px; height:13px;
    border-radius:7px; background:#3a3a3a; color:#9a9a9a; font-size:9px;
    line-height:13px; text-align:center; padding:0 3px; border:1px solid #262626;
  }
  .chip.pulse{ animation:pulse .5s ease; }
  @keyframes pulse{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.09); }
    100%{ transform:scale(1); }
  }
  .add{
    width:20px;height:24px;border:1px dashed #4a4a4a;border-radius:4px;
    display:flex;align-items:center;justify-content:center;color:#666;
    font-size:12px; cursor:default; flex:0 0 20px;
  }

  /* ---------- 面板底部提示 ---------- */
  .p-foot{
    margin-top:10px; padding:9px 11px; border-radius:6px;
    background:#1f1f1f; border:1px solid #333;
    font-size:11px; color:var(--dim); line-height:1.65;
  }
  .p-foot b{color:var(--text2); font-weight:600;}

  /* ---------- 画布 ---------- */
  #canvas{display:block; width:100%; height:100%;}
  .grid-line{stroke:#262626; stroke-width:1;}

  .hud{
    position:absolute; left:16px; bottom:16px;
    display:flex; align-items:center; gap:7px;
    padding:6px 11px; border-radius:6px;
    background:rgba(30,30,30,.94); border:1px solid #3f3f3f;
    font-size:11.5px; color:var(--text2);
    opacity:0; transform:translateY(6px);
    transition:opacity .22s, transform .22s;
    pointer-events:none; backdrop-filter:blur(4px);
  }
  .hud.show{opacity:1; transform:translateY(0);}
  .hud .sw3{width:9px;height:9px;border-radius:2px;}
  .hud .arrow{color:var(--dim2);}

  .cmdbar{
    position:absolute; left:16px; top:14px;
    font-family:Consolas,"Courier New",monospace; font-size:11px;
    color:#7a7a7a; background:rgba(20,20,20,.8); border:1px solid #2f2f2f;
    border-radius:5px; padding:5px 9px; opacity:0; transition:opacity .2s;
  }
  .cmdbar.show{opacity:1;}
  .cmdbar .k{color:var(--info);}

  /* ---------- 字幕 ---------- */
  .narr{
    min-height:56px; display:flex; align-items:center; gap:10px;
    padding:0 18px; background:#202020; border-top:1px solid #333;
  }
  .narr .idx{
    flex:0 0 auto; width:20px;height:20px;border-radius:50%;
    background:#2f2f2f; color:#8c8c8c; font-size:10.5px;
    display:flex;align-items:center;justify-content:center;
  }
  .narr .txt{font-size:12.5px; color:var(--text2); line-height:1.5;}
  .narr .txt b{color:#fff; font-weight:600;}
  .narr .txt em{font-style:normal; color:var(--warn);}

  /* ---------- 说明区 ---------- */
  .notes{
    width:100%; max-width:1000px; display:grid;
    grid-template-columns:repeat(3,1fr); gap:12px;
  }
  .note{
    background:#202020; border:1px solid #2e2e2e; border-radius:8px; padding:13px 14px;
  }
  .note h4{
    margin:0 0 7px; font-size:12px; color:#e6e6e6; font-weight:600;
    display:flex; align-items:center; gap:6px;
  }
  .note h4 .tag{
    font-size:9.5px; font-weight:400; color:#8c8c8c; background:#2c2c2c;
    border-radius:3px; padding:1px 5px;
  }
  .note p{margin:0; font-size:11.5px; line-height:1.75; color:#9a9a9a;}
  .note p b{color:#cfcfcf; font-weight:600;}
  .note code{
    background:#2a2a2a; border-radius:3px; padding:1px 4px;
    font-family:Consolas,monospace; font-size:10.5px; color:#c8c8c8;
  }
</style>
</head>
<body>

<div class="card">
  <div class="top">
    <div class="ttl">Y_归层工具 · 多图层<small>一个类别配多个图层，画的时候怎么用</small></div>
    <div class="sp"></div>
    <div class="tabs" id="tabs">
      <button data-mode="sticky" class="on">粘滞</button>
      <button data-mode="hotkey">快捷键</button>
      <button data-mode="wheel">圆盘</button>
    </div>
    <button class="replay" id="replay">重播</button>
  </div>

  <div class="main">
    <div class="left">
      <div class="panel">
        <div class="p-head">
          <span class="dot"></span>
          <span class="name">Y_归层工具</span>
          <span class="sp"></span>
          <span class="sw"></span>
        </div>
        <div class="p-row">
          <span class="cat">线段</span>
          <div class="chips" id="chips-line"></div>
        </div>
        <div class="p-row">
          <span class="cat">文字</span>
          <div class="chips" id="chips-text"></div>
        </div>
        <div class="p-row">
          <span class="cat">标注</span>
          <div class="chips" id="chips-dim"></div>
        </div>
        <div class="p-row">
          <span class="cat">填充</span>
          <div class="chips" id="chips-hatch"></div>
        </div>
        <div class="p-row">
          <span class="cat">引线</span>
          <div class="chips" id="chips-leader"></div>
        </div>
        <div class="p-row">
          <span class="cat">块</span>
          <div class="chips" id="chips-block"></div>
        </div>
      </div>

      <div class="p-foot" id="foot">
        <b>矩形已经并进线段</b>（圆、弧、样条本来就在里面）。<br>
        只有配了多个图层的类别才展开；单层的只写一行「→ 哪层」。
      </div>
    </div>

    <div class="right">
      <svg id="canvas" viewBox="0 0 560 400" preserveAspectRatio="xMidYMid meet">
        <defs>
          <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M20 0 L0 0 0 20" fill="none" stroke="#242424" stroke-width="1"/>
          </pattern>
        </defs>
        <rect width="560" height="400" fill="url(#grid)"/>
        <g id="scene"></g>
        <g id="hold"></g>
        <g id="pie"></g>
        <g id="cursor" style="opacity:0">
          <circle r="4" fill="none" stroke="#ffffff" stroke-width="1.4" opacity=".85"/>
          <circle r="1.4" fill="#ffffff" opacity=".9"/>
        </g>
      </svg>
      <div class="cmdbar" id="cmdbar"></div>
      <div class="pie-ctrl" id="pie-ctrl">
        <span class="lbl">试层数</span>
        <button data-n="2">2</button>
        <button data-n="3">3</button>
        <button data-n="5">5</button>
        <button data-n="8">8</button>
        <button data-n="12">12</button>
        <button data-n="16">16</button>
      </div>
      <div class="hud" id="hud">
        <span class="arrow">目标图层</span>
        <span class="sw3" id="hud-sw"></span>
        <span id="hud-name"></span>
      </div>
    </div>
  </div>

  <div class="narr">
    <div class="idx" id="narr-idx">1</div>
    <div class="txt" id="narr-txt">选一种模式看效果。</div>
  </div>
</div>

<div class="notes">
  <div class="note">
    <h4>核心原则 <span class="tag">不割裂</span></h4>
    <p>一条绘图命令<b>从头到尾只用一个图层</b>。PLINE 画 10 段也全在同一层，绝不会画到一半跳到别的层。</p>
  </div>
  <div class="note">
    <h4>什么时候换 <span class="tag">时机</span></h4>
    <p>只在<b>命令之间</b>换。正在画的时候按快捷键也只对<b>下一条</b>生效，不撕开当前这条。</p>
  </div>
  <div class="note">
    <h4>换了会自己跳回去吗 <span class="tag">保持</span></h4>
    <p>不会。切到哪层就<b>一直用哪层</b>，直到你下次主动切 —— 这点和现在「命令结束还原图层」是两回事。</p>
  </div>
</div>

<script>
(function(){
  "use strict";

  var NS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById("canvas");
  var scene = document.getElementById("scene");
  var cursor = document.getElementById("cursor");
  var hud = document.getElementById("hud");
  var hudSw = document.getElementById("hud-sw");
  var hudName = document.getElementById("hud-name");
  var cmdbar = document.getElementById("cmdbar");
  var narrTxt = document.getElementById("narr-txt");
  var narrIdx = document.getElementById("narr-idx");
  var foot = document.getElementById("foot");
  var pieG = document.getElementById("pie");
  var holdG = document.getElementById("hold");

  var LAYERS = {
    "E-04 造型线": "#6ea8e0",
    "E-05 辅助线": "#e0a050",
    "E-01 结构":   "#b98be0",
    "E-10 文字":   "#8fd0c0",
    "E-12 标注":   "#e07a7a",
    "E-13 填充":   "#6fbf73",
    "E-14 引线":   "#d08fd0",
    "E-15 块":     "#a0b0c0",
    "E-02 墙体":   "#7ab8d8",
    "E-03 门窗":   "#c8b06a",
    "E-06 收口":   "#9ec46a",
    "E-07 家具":   "#d99a6a",
    "E-08 设备":   "#8aa8e8",
    "E-09 地坪":   "#6ac8b0",
    "E-16 轴线":   "#c78ac0",
    "E-17 天花":   "#b0a0d8"
  };

  // 圆盘「试层数」用的备选清单，前 8 个是常用层
  var EXT = [
    "E-04 造型线", "E-05 辅助线", "E-01 结构", "E-02 墙体",
    "E-03 门窗",   "E-06 收口",   "E-07 家具", "E-08 设备",
    "E-09 地坪",   "E-10 文字",   "E-12 标注", "E-13 填充",
    "E-14 引线",   "E-15 块",     "E-16 轴线", "E-17 天花"
  ];

  var POOL = {
    line:   ["E-04 造型线", "E-05 辅助线", "E-01 结构"],
    text:   ["E-10 文字"],
    dim:    ["E-12 标注"],
    hatch:  ["E-13 填充"],
    leader: ["E-14 引线"],
    block:  ["E-15 块"]
  };

  var active = { line: 0, text: 0, dim: 0, hatch: 0, leader: 0, block: 0 };
  var token = 0;
  var stepNo = 0;

  // ---------------- 面板渲染 ----------------
  function renderChips(){
    build("chips-line",   "line");
    build("chips-text",   "text");
    build("chips-dim",    "dim");
    build("chips-hatch",  "hatch");
    build("chips-leader", "leader");
    build("chips-block",  "block");
  }

  function build(hostId, key){
    var host = document.getElementById(hostId);
    host.innerHTML = "";

    // 只配一个层 → 不装成可操作，写一行静态的「→ 哪层」
    if (POOL[key].length === 1){
      host.classList.add("static");
      var sw0 = document.createElement("span");
      sw0.className = "sw2";
      sw0.style.background = LAYERS[POOL[key][0]];
      var arw = document.createElement("span");
      arw.className = "arw";
      arw.textContent = "→";
      var tx0 = document.createElement("span");
      tx0.textContent = POOL[key][0];
      host.appendChild(arw); host.appendChild(sw0); host.appendChild(tx0);
      return;
    }
    host.classList.remove("static");

    POOL[key].forEach(function(name, i){
      var chip = document.createElement("div");
      chip.className = "chip" + (active[key] === i ? " on" : "");
      chip.dataset.key = key;
      chip.dataset.i = i;

      var sw = document.createElement("span");
      sw.className = "sw2";
      sw.style.background = LAYERS[name];
      chip.appendChild(sw);

      var tx = document.createElement("span");
      tx.textContent = name;
      chip.appendChild(tx);

      var ord = document.createElement("span");
      ord.className = "ord";
      ord.textContent = (i + 1);
      chip.appendChild(ord);

      host.appendChild(chip);
    });
    if (key === "line"){
      var add = document.createElement("div");
      add.className = "add";
      add.textContent = "+";
      host.appendChild(add);
    }
  }

  function setActive(key, i, pulse){
    active[key] = i;
    var chips = document.querySelectorAll('.chip[data-key="' + key + '"]');
    for (var k = 0; k < chips.length; k++){
      var on = Number(chips[k].dataset.i) === i;
      chips[k].classList.toggle("on", on);
      if (on && pulse){
        chips[k].classList.remove("pulse");
        void chips[k].offsetWidth;
        chips[k].classList.add("pulse");
      }
    }
  }

  // ---------------- 画布 ----------------
  function clearScene(){
    while (scene.firstChild) scene.removeChild(scene.firstChild);
    clearGroup(holdG); clearGroup(pieG);
    cursor.style.opacity = 0;
    hud.classList.remove("show");
    cmdbar.classList.remove("show");
  }

  function clearGroup(g){
    while (g.firstChild) g.removeChild(g.firstChild);
    g.classList.remove("in");
    g.classList.remove("out");
    g.style.transform = "";
  }

  function moveCursor(x, y, dur){
    cursor.style.opacity = 1;
    cursor.style.transition = "transform " + (dur || 260) + "ms cubic-bezier(.4,0,.2,1)";
    cursor.setAttribute("transform", "translate(" + x + "," + y + ")");
  }

  function drawPath(d, color, dur){
    dur = dur || 420;
    return new Promise(function(resolve){
      var p = document.createElementNS(NS, "path");
      p.setAttribute("d", d);
      p.setAttribute("fill", "none");
      p.setAttribute("stroke", color);
      p.setAttribute("stroke-width", "2.2");
      p.setAttribute("stroke-linecap", "round");
      p.setAttribute("stroke-linejoin", "round");
      scene.appendChild(p);
      var len = 0;
      try { len = p.getTotalLength(); } catch(e){ len = 400; }
      p.style.strokeDasharray = len;
      p.style.strokeDashoffset = len;
      p.getBoundingClientRect();
      p.style.transition = "stroke-dashoffset " + dur + "ms linear";
      p.style.strokeDashoffset = 0;
      setTimeout(function(){
        p.style.strokeDasharray = "none";
        resolve();
      }, dur + 40);
    });
  }

  function showHud(layerName, ms){
    hudSw.style.background = LAYERS[layerName];
    hudName.textContent = layerName;
    hud.classList.add("show");
    if (ms) setTimeout(function(){ hud.classList.remove("show"); }, ms);
  }

  function showCmd(text, ms){
    cmdbar.innerHTML = text;
    cmdbar.classList.add("show");
    if (ms) setTimeout(function(){ cmdbar.classList.remove("show"); }, ms);
  }

  function say(idx, html){
    stepNo = idx;
    narrIdx.textContent = idx;
    narrTxt.innerHTML = html;
  }

  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  function guard(t, ms){
    return sleep(ms).then(function(){
      if (t !== token) throw "cancel";
    });
  }

  // ---------------- 圆盘（右键长按） ----------------
  // 2~8 个：单环均分。9~16 个：两环，每环 8 格，角度对齐。
  // 数量少就少画几格，不留空位；只有 1 个时根本不该弹圆盘。
  function polar(cx, cy, r, deg){
    var a = (deg - 90) * Math.PI / 180;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  }

  function fp(p){ return p[0].toFixed(2) + " " + p[1].toFixed(2); }

  function sectorPath(cx, cy, r0, r1, a0, a1){
    var p0 = polar(cx, cy, r1, a0), p1 = polar(cx, cy, r1, a1);
    var q1 = polar(cx, cy, r0, a1), q0 = polar(cx, cy, r0, a0);
    var big = (a1 - a0) > 180 ? 1 : 0;
    return "M" + fp(p0) +
           " A" + r1 + " " + r1 + " 0 " + big + " 1 " + fp(p1) +
           " L" + fp(q1) +
           " A" + r0 + " " + r0 + " 0 " + big + " 0 " + fp(q0) + " Z";
  }

  function hexA(hex, a){
    var n = parseInt(hex.slice(1), 16);
    return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
  }

  function el(tag, attrs){
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function ringLayout(n){
    if (n <= 8) return [{ r0: 46, r1: 100, from: 0, count: n }];
    return [
      { r0: 70, r1: 108, from: 0, count: 8 },
      { r0: 32, r1: 62,  from: 8, count: n - 8 }
    ];
  }

  // 长按进度环：按住不放时给个「正在发生什么」的反馈
  function holdRing(cx, cy, ms){
    return new Promise(function(resolve){
      clearGroup(holdG);
      var r = 21, C = 2 * Math.PI * r;
      holdG.appendChild(el("circle", {
        cx: cx, cy: cy, r: r, fill: "none", stroke: "#3a3a3a", "stroke-width": 2.4
      }));
      var arc = el("circle", {
        cx: cx, cy: cy, r: r, fill: "none", stroke: "#4a92d4", "stroke-width": 2.4,
        "stroke-linecap": "round", transform: "rotate(-90 " + cx + " " + cy + ")"
      });
      arc.style.strokeDasharray = C;
      arc.style.strokeDashoffset = C;
      holdG.appendChild(arc);
      arc.getBoundingClientRect();
      arc.style.transition = "stroke-dashoffset " + ms + "ms linear";
      arc.style.strokeDashoffset = 0;
      setTimeout(resolve, ms + 20);
    });
  }

  var PIE_C = null, PIE_ITEMS = null;
  var hubName = null, hubHint = null;

  function openPie(cx, cy, items){
    clearGroup(holdG);
    clearGroup(pieG);
    PIE_ITEMS = items;
    var n = items.length;
    if (n < 2){ PIE_C = null; return; }
    PIE_C = [cx, cy];

    var rings = ringLayout(n);
    var Rmax = 0;
    rings.forEach(function(rg){ Rmax = Math.max(Rmax, rg.r1); });

    // 背板 + 外圈
    pieG.appendChild(el("circle", { cx: cx, cy: cy, r: Rmax + 15, fill: "#131313", opacity: ".92" }));
    pieG.appendChild(el("circle", {
      cx: cx, cy: cy, r: Rmax + 15, fill: "none",
      stroke: "rgba(255,255,255,.07)", "stroke-width": 1
    }));

    var k = 0;
    rings.forEach(function(rg){
      var step = 360 / rg.count;
      var gap = rg.count <= 4 ? 2.6 : (rg.count <= 8 ? 1.6 : 1.2);
      var mid = (rg.r0 + rg.r1) / 2;
      var fs = rg.count <= 4 ? 11 : (rg.count <= 8 ? 10 : 9.5);

      for (var j = 0; j < rg.count; j++){
        var idx = rg.from + j;
        var name = items[idx];
        var col = LAYERS[name] || "#8a8a8a";
        var a0 = j * step + gap / 2, a1 = (j + 1) * step - gap / 2;
        var ang = j * step + step / 2;

        var p = el("path", {
          d: sectorPath(cx, cy, rg.r0, rg.r1, a0, a1),
          fill: hexA(col, .17),
          stroke: hexA(col, .5),
          "stroke-width": 0.9,
          "stroke-linejoin": "round"
        });
        p.dataset.i = idx;
        p.style.animation = "sectorIn .22s ease-out both";
        p.style.animationDelay = (k * 16) + "ms";
        pieG.appendChild(p);

        var twoLine = (rg.r1 - rg.r0) >= 36;
        var tp = polar(cx, cy, mid, ang);
        var t1 = el("text", {
          x: tp[0], y: tp[1] + (twoLine ? -5 : 0), "text-anchor": "middle",
          "dominant-baseline": "central", "font-size": fs, fill: "#dedede"
        });
        t1.textContent = name.split(" ")[1] || name;
        pieG.appendChild(t1);

        if (twoLine){
          var t2 = el("text", {
            x: tp[0], y: tp[1] + 6, "text-anchor": "middle",
            "dominant-baseline": "central", "font-size": fs - 2, fill: "#8d8d8d"
          });
          t2.textContent = name.split(" ")[0];
          pieG.appendChild(t2);
        }
        k++;
      }
    });

    // 中心
    var hubR = rings[rings.length - 1].r0 - 8;
    pieG.appendChild(el("circle", {
      cx: cx, cy: cy, r: hubR, fill: "#1e1e1e",
      stroke: "rgba(255,255,255,.09)", "stroke-width": 1
    }));

    hubName = el("text", {
      x: cx, y: cy - 1, "text-anchor": "middle",
      "font-size": 10, fill: "#b0b0b0"
    });
    hubName.textContent = "取消";
    pieG.appendChild(hubName);

    hubHint = el("text", {
      x: cx, y: cy + 12, "text-anchor": "middle",
      "font-size": 8.5, fill: "#6f6f6f"
    });
    hubHint.textContent = "松手在中间";
    pieG.appendChild(hubHint);

    pieG.classList.remove("out");
    pieG.classList.add("in");
  }

  function pieHi(i){
    if (!PIE_C) return;
    var paths = pieG.querySelectorAll("path");
    for (var k = 0; k < paths.length; k++){
      var idx = Number(paths[k].dataset.i);
      var on = idx === i;
      var nm = PIE_ITEMS[idx];
      var col = LAYERS[nm] || "#8a8a8a";
      paths[k].setAttribute("fill", hexA(col, on ? .37 : .17));
      paths[k].setAttribute("stroke", hexA(col, on ? 1 : .5));
      paths[k].setAttribute("stroke-width", on ? 1.7 : 0.9);
    }
    if (!hubName) return;
    if (i >= 0 && PIE_ITEMS[i]){
      var nm2 = PIE_ITEMS[i];
      hubName.textContent = nm2.split(" ")[1] || nm2;
      hubName.setAttribute("fill", "#ffffff");
      hubHint.textContent = nm2.split(" ")[0];
      hubHint.setAttribute("fill", LAYERS[nm2] || "#8d8d8d");
    } else {
      hubName.textContent = "取消";
      hubName.setAttribute("fill", "#b0b0b0");
      hubHint.textContent = "松手在中间";
      hubHint.setAttribute("fill", "#6f6f6f");
    }
  }

  function closePie(){
    pieG.classList.remove("in");
    pieG.classList.add("out");
    PIE_C = null; PIE_ITEMS = null; hubName = null; hubHint = null;
  }

  // ---------------- 场景 ----------------
  var FRAME = {
    top:   "M120 90 L440 90",
    left:  "M120 90 L120 310",
    right: "M440 90 L440 310",
    bottom:"M120 310 L440 310",
    mid:   "M280 90 L280 310",
    hline: "M120 200 L440 200",
    base:  "M120 352 L440 352",
    win:   "M190 140 L370 140 L370 250 L190 250 Z"
  };

  async function scenarioSticky(t){
    say(1, "现在<b>线段</b>配了 3 个图层（矩形已经并进来了），当前用的是 <em>E-04 造型线</em>。先画一个外框。");
    await guard(t, 900);

    showCmd('<span class="k">命令:</span> PLINE');
    moveCursor(120, 90, 300); await guard(t, 320);
    await drawPath(FRAME.top, LAYERS["E-04 造型线"]);
    moveCursor(440, 90, 260); await guard(t, 280);
    await drawPath(FRAME.right, LAYERS["E-04 造型线"]);
    moveCursor(440, 310, 300); await guard(t, 300);
    await drawPath(FRAME.bottom, LAYERS["E-04 造型线"]);
    moveCursor(120, 310, 300); await guard(t, 300);
    await drawPath(FRAME.left, LAYERS["E-04 造型线"]);
    await guard(t, 350);
    showCmd('<span class="k">命令:</span> 结束');

    say(2, "整条命令全部落在 <b>E-04</b>，一段都没跑偏。");
    await guard(t, 1100);

    say(3, "现在我要改画辅助线 —— 点一下 <b>E-05</b> 那个图层。");
    await guard(t, 700);
    setActive("line", 1, true);
    showHud("E-05 辅助线", 1600);
    await guard(t, 900);

    say(4, "切过去之后<b>一直用它</b>，不会画一条跳一下。");
    await guard(t, 600);
    moveCursor(280, 90, 300); await guard(t, 320);
    await drawPath(FRAME.mid, LAYERS["E-05 辅助线"]);
    moveCursor(120, 200, 300); await guard(t, 320);
    await drawPath(FRAME.hline, LAYERS["E-05 辅助线"]);
    await guard(t, 500);

    say(5, "关键点：切换是<b>你主动做的</b>，插件不会自作主张换层。");
    await guard(t, 1800);
  }


  async function scenarioHotkey(t){
    say(1, "<b>快捷键</b>模式：正在画的时候按 <b>Tab</b>，切到池里的下一个。");
    await guard(t, 1000);

    showCmd('<span class="k">命令:</span> PLINE');
    moveCursor(120, 90, 300); await guard(t, 320);
    await drawPath(FRAME.top, LAYERS["E-04 造型线"]);

    moveCursor(440, 90, 280); await guard(t, 300);
    await drawPath(FRAME.right, LAYERS["E-04 造型线"]);

    say(2, "画到一半，我按了一下 <b>Tab</b>。");
    await guard(t, 700);
    showHud("下一条 → E-05 辅助线", 2200);
    setActive("line", 1, true);
    await guard(t, 1200);

    say(3, "注意：<b>当前这条仍然在 E-04</b>。Tab 只对下一条生效，不会把这条撕成两层。");
    await guard(t, 1500);

    moveCursor(440, 310, 300); await guard(t, 320);
    await drawPath(FRAME.bottom, LAYERS["E-04 造型线"]);
    await guard(t, 300);
    showCmd('<span class="k">命令:</span> 结束');
    await guard(t, 800);

    showCmd('<span class="k">命令:</span> PLINE');
    moveCursor(120, 352, 300); await guard(t, 320);
    await drawPath(FRAME.base, LAYERS["E-05 辅助线"]);
    await guard(t, 300);
    showCmd('<span class="k">命令:</span> 结束');

    say(4, "下一条才用上 <b>E-05</b>。中途改主意也不会破坏已经画好的部分。");
    await guard(t, 1800);
  }

  async function scenarioWheel(t){
    say(1, "<b>右键长按</b>也能换层。但前提是 —— <b>短按必须还是 CAD 自己的右键菜单</b>，不能抢。");
    await guard(t, 1500);

    showCmd('<span class="k">命令:</span> PLINE');
    moveCursor(120, 90, 300); await guard(t, 320);
    await drawPath(FRAME.top, LAYERS["E-04 造型线"]);
    moveCursor(440, 90, 280); await guard(t, 300);
    await drawPath(FRAME.right, LAYERS["E-04 造型线"]);
    await guard(t, 350);

    say(2, "画到一半要换层：右键<b>按住不放</b>。按住超过 0.3 秒，圆盘才出来。");
    await guard(t, 600);
    moveCursor(300, 210, 320);
    await guard(t, 360);
    await holdRing(300, 210, 400);

    say(3, "圆盘里只放<b>线段这一类的 3 个层</b>，不是全部图层。光标往哪推，哪个扇区亮。");
    openPie(300, 210, POOL.line);
    await guard(t, 520);
    moveCursor(300, 296, 300);
    await guard(t, 340);
    pieHi(1);
    await guard(t, 1100);

    say(4, "松手就切。但<b>手上这条命令不受影响</b> —— 剩下的段还留在 E-04。");
    await guard(t, 400);
    closePie();
    await guard(t, 240);
    setActive("line", 1, true);
    showHud("E-05 辅助线", 1600);
    moveCursor(440, 310, 300); await guard(t, 320);
    await drawPath(FRAME.bottom, LAYERS["E-04 造型线"]);
    await guard(t, 300);
    showCmd('<span class="k">命令:</span> 结束');
    await guard(t, 800);

    say(5, "下一条命令才用上 <b>E-05</b>。和 Tab 一个道理，只是更快、不用记快捷键。");
    await guard(t, 900);
    showCmd('<span class="k">命令:</span> PLINE');
    moveCursor(120, 352, 300); await guard(t, 320);
    await drawPath(FRAME.base, LAYERS["E-05 辅助线"]);
    await guard(t, 300);
    showCmd('<span class="k">命令:</span> 结束');
    await guard(t, 1800);
  }

  // ---------------- 运行控制 ----------------
  var SCENES = {
    sticky: { run: scenarioSticky, foot: "<b>粘滞</b>（默认）<br>一直用当前那层，直到你主动切。<br>最不容易画乱，日常推荐。" },
    hotkey: { run: scenarioHotkey, foot: "<b>快捷键</b><br>画的时候按 Tab 切下一个，<br>不打断手上的活。" },
    wheel:  { run: scenarioWheel,  foot: "<b>圆盘</b>（右键长按）<br>短按照旧，按住 0.3 秒才出圆盘。<br>换层最快，但要能挂住鼠标消息。" }
  };

  var current = "sticky";

  async function play(mode){
    token++;
    var t = token;
    current = mode;
    active = { line: 0, text: 0, dim: 0, hatch: 0, leader: 0, block: 0 };
    clearScene();
    renderChips();
    foot.innerHTML = SCENES[mode].foot;
    narrTxt.textContent = "…";
    narrIdx.textContent = "1";
    document.getElementById("pie-ctrl").classList.toggle("on", mode === "wheel");
    document.querySelectorAll("#pie-ctrl button").forEach(function(b){
      b.classList.remove("on");
    });

    document.querySelectorAll("#tabs button").forEach(function(b){
      b.classList.toggle("on", b.dataset.mode === mode);
    });

    try { await SCENES[mode].run(t); }
    catch (e){ if (e !== "cancel") console.error(e); }
  }

  document.getElementById("tabs").addEventListener("click", function(e){
    var b = e.target.closest("button");
    if (b && b.dataset.mode) play(b.dataset.mode);
  });
  document.getElementById("replay").addEventListener("click", function(){
    play(current);
  });

  // 圆盘「试层数」：直接看 2 / 3 / 5 / 8 / 12 / 16 个层时长什么样
  function piePoint(cx, cy, n, idx){
    if (n <= 8){
      var step = 360 / n;
      return polar(cx, cy, 88, idx * step + step / 2);
    }
    var ang = (idx % 8) * 45 + 22.5;
    return polar(cx, cy, idx < 8 ? 89 : 49, ang);
  }

  document.getElementById("pie-ctrl").addEventListener("click", function(e){
    var b = e.target.closest("button");
    if (!b || !b.dataset.n) return;
    var n = Number(b.dataset.n);

    document.querySelectorAll("#pie-ctrl button").forEach(function(x){
      x.classList.toggle("on", x === b);
    });

    token++;
    clearScene();
    showCmd('<span class="k">命令:</span> PLINE');

    var cx = 280, cy = 205;
    var idx = Math.min(2, n - 1);
    var pt = piePoint(cx, cy, n, idx);
    moveCursor(pt[0], pt[1], 180);

    setTimeout(function(){
      openPie(cx, cy, EXT.slice(0, n));
      setTimeout(function(){ pieHi(idx); }, 240);

      var note;
      if (n <= 8){
        note = "<b>" + n + " 个</b>层就均分成 " + n + " 格 —— 有几个画几个，不留空位。";
      } else if (n === 16){
        note = "<b>16 个</b>：外圈 8 格、内圈 8 格，上下角度对齐，最多就到这里。";
      } else {
        note = "<b>" + n + " 个</b>层自动分成两圈（外圈 8 格、内圈 " + (n - 8) + " 格）。";
      }
      say("—", note);
    }, 200);
  });

  // 点 chip 也能切（演示里直接响应）
  document.addEventListener("click", function(e){
    var chip = e.target.closest(".chip");
    if (!chip) return;
    var key = chip.dataset.key;
    var i = Number(chip.dataset.i);
    if (key !== "line") return;
    setActive("line", i, true);
    showHud(POOL.line[i], 1400);
  });

  // 支持 ?mode=sticky|hotkey|wheel 直接进某个模式（方便截图/分享）
  var q = (location.search.match(/[?&]mode=(\w+)/) || [])[1];
  play(SCENES[q] ? q : "sticky");

  // ?n=2..16 直接看某个层数的圆盘
  var qn = (location.search.match(/[?&]n=(\d+)/) || [])[1];
  if (qn){
    setTimeout(function(){
      var btn = document.querySelector('#pie-ctrl button[data-n="' + qn + '"]');
      if (btn) btn.click();
    }, 500);
  }
})();
</script>
</body>
